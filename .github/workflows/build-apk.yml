name: Build Velan AI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Build Shared Types & Vite Client
        run: |
          npm run build --prefix shared || true
          npm run build --prefix client

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || true
        working-directory: ./client

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "client/android/gradlew" ]; then
            chmod +x client/android/gradlew
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          if [ -f "client/android/gradlew" ]; then
            cd client/android && ./gradlew assembleDebug --stacktrace
          else
            cd client/android && gradle assembleDebug --stacktrace || true
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: velan-ai-debug-apk
          path: |
            client/android/app/build/outputs/apk/debug/*.apk
            client/dist
          if-no-files-found: warn
